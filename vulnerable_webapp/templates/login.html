{% extends 'base.html' %}

{% block title %}로그인{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-circle"></i>
            <h2>로그인</h2>
            <p>계정에 로그인하세요</p>
        </div>
        
        {% if error %}
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i>
                <!-- 취약점: 에러 메시지가 그대로 출력됨 (SQL 에러 노출 가능) -->
                {{ error }}
            </div>
        {% endif %}
        
        <!-- 취약점: CSRF 토큰 없음 -->
        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> 아이디
                </label>
                <!-- 취약점: SQL Injection 가능 -->
                <input type="text" id="username" name="username" required 
                       placeholder="아이디를 입력하세요" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> 비밀번호
                </label>
                <input type="password" id="password" name="password" required
                       placeholder="비밀번호를 입력하세요">
            </div>
            
            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember"> 로그인 상태 유지
                </label>
                <a href="#" class="forgot-link">비밀번호 찾기</a>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-sign-in-alt"></i> 로그인
            </button>
        </form>
        
        <div class="auth-footer">
            <p>계정이 없으신가요? <a href="{{ url_for('register') }}">회원가입</a></p>
        </div>
        
        <!-- 취약점: 테스트 계정 정보 노출 -->
        <div class="test-accounts" style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; font-size: 12px;">
            <p style="color: #666;"><strong>🧪 테스트 계정:</strong></p>
            <p style="color: #888;">admin / admin123 (관리자)</p>
            <p style="color: #888;">user1 / password1 (일반 사용자)</p>
            <p style="color: #888;">testuser / test1234 (테스트)</p>
        </div>
    </div>
</div>

<!-- 취약점: 주석에 힌트 노출 -->
