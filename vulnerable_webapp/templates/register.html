{% extends 'base.html' %}

{% block title %}회원가입{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-plus"></i>
            <h2>회원가입</h2>
            <p>VulnBank의 새로운 회원이 되세요</p>
        </div>
        
        {% if error %}
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i>
                {{ error }}
            </div>
        {% endif %}
        
        <!-- 취약점: CSRF 토큰 없음 -->
        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> 아이디
                </label>
                <!-- 취약점: SQL Injection 가능 -->
                <input type="text" id="username" name="username" required 
                       placeholder="사용할 아이디를 입력하세요" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> 이메일
                </label>
                <input type="email" id="email" name="email" required
                       placeholder="이메일 주소를 입력하세요">
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> 비밀번호
                </label>
                <!-- 취약점: 비밀번호 강도 검사 없음 -->
                <input type="password" id="password" name="password" required
                       placeholder="비밀번호를 입력하세요">
                <small class="form-hint">비밀번호는 4자 이상이어야 합니다.</small>
            </div>
            
            <div class="form-group">
                <label for="password_confirm">
                    <i class="fas fa-lock"></i> 비밀번호 확인
                </label>
                <input type="password" id="password_confirm" name="password_confirm" required
                       placeholder="비밀번호를 다시 입력하세요">
            </div>
            
            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" name="agree" required> 
                    <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의합니다
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-user-plus"></i> 가입하기
            </button>
        </form>
        
        <div class="auth-footer">
            <p>이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
        </div>
    </div>
</div>

<!-- 취약점: 주석에 기술 정보 노출 -->
<!-- 
Password hashing: MD5 (취약함 - SHA-256 또는 bcrypt로 변경 필요)
Database: SQLite3 - vulnbank.db
-->
{% endblock %}
