<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}보안 진단 자동화 시스템{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    
    <!-- Base CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0f172a !important; border-bottom: 1px solid #334155;">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('main.projects') }}" style="color: #f1f5f9 !important;">
                <i class="fas fa-shield-alt me-2"></i>보안 진단 자동화 시스템
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="border-color: #475569;">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('main.projects') }}" style="color: #cbd5e1 !important;">
                            <i class="fas fa-folder me-1"></i>프로젝트
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <main class="container-fluid py-4" style="background-color: #0f172a; min-height: calc(100vh - 200px);">
        {% block content %}{% endblock %}
    </main>
    
    <footer class="py-3 mt-5" style="background-color: #0f172a !important; border-top: 1px solid #334155;">
        <div class="container-fluid text-center">
            <p class="mb-0" style="color: #94a3b8 !important;">&copy; 2024 보안 진단 자동화 시스템</p>
        </div>
    </footer>
    
    <!-- jQuery (DataTables 의존성) - 먼저 로드 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    
    <!-- Marked.js (Markdown 렌더링) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
