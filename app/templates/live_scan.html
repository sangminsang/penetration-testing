<!DOCTYPE html>
<html>
<head>
    <title>Recon Insight Professional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; }
        .stat-box { background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 10px; text-align: center; }
        .stat-val { font-size: 24px; font-weight: bold; color: #58a6ff; }
        .log-win { height: 350px; overflow-y: auto; background: #000; padding: 15px; border: 1px solid #30363d; font-family: monospace; font-size: 12px; margin-bottom: 20px; }
        .tech-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .tech-card { background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; border-left: 4px solid #238636; }
        .tech-card:hover { border-color: #58a6ff; background: #1c2128; }
        .raw-data { background: #000; color: #00ff41; padding: 15px; border-radius: 4px; font-size: 11px; white-space: pre-wrap; font-family: 'Consolas', monospace; }
    </style>
</head>
<body class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
        <h4 class="fw-bold text-white">🔍 RECON_INSIGHT <span class="text-secondary fw-light">| Professional Analysis</span></h4>
        <div>
            <button id="startBtn" class="btn btn-success btn-sm px-4 fw-bold">RUN RECON</button>
            <a href="/url-tree/{{ project.id }}" class="btn btn-outline-info btn-sm ms-2">VIEW TREE</a>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4"><div class="stat-box"><div>FOUND_URLS</div><div id="urlCount" class="stat-val">0</div></div></div>
        <div class="col-md-4"><div class="stat-box"><div>TECH_STACK</div><div id="techCount" class="stat-val">0</div></div></div>
        <div class="col-md-4"><div class="stat-box"><div>PROGRESS</div><div id="progText" class="stat-val">0%</div></div></div>
    </div>

    <div id="logWindow" class="log-win text-secondary">시스템 대기 중... 스캔 버튼을 누르세요.</div>

    <h6 class="mb-3 text-success fw-bold">🛡️ IDENTIFIED TECHNOLOGIES <small class="text-muted">(Click to view Raw Evidence)</small></h6>
    <div id="techGrid" class="tech-grid">
        </div>

    <div class="modal fade" id="evidenceModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-dark border-secondary">
                <div class="modal-header border-secondary text-white">
                    <h5 class="modal-title">🔬 Raw Detection Evidence</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div id="modalBody" class="modal-body raw-data"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const techGrid = document.getElementById('techGrid');
        const logWindow = document.getElementById('logWindow');
        const modal = new bootstrap.Modal(document.getElementById('evidenceModal'));

        document.getElementById('startBtn').onclick = () => {
            logWindow.innerHTML = "";
            techGrid.innerHTML = "";
            document.getElementById('startBtn').disabled = true;
            socket.emit('start_scan', { target: "{{ project.target }}" });
        };

        socket.on('scan_progress', (data) => {
            document.getElementById('progText').innerText = (data.progress || 0) + "%";
            addLog(data.current_item);
        });

        socket.on('technology_detected', (data) => {
            document.getElementById('techCount').innerText = parseInt(document.getElementById('techCount').innerText) + 1;
            
            const card = document.createElement('div');
            card.className = 'tech-card';
            card.innerHTML = `
                <div class="small text-secondary mb-1">${data.source}</div>
                <div class="fw-bold text-white">${data.name}</div>
                <div class="text-info small">${data.version || 'Version Unknown'}</div>
            `;
            card.onclick = () => {
                document.getElementById('modalBody').innerText = data.evidence || "No raw evidence captured.";
                modal.show();
            };
            techGrid.appendChild(card);
        });

        socket.on('url_discovered', () => {
            document.getElementById('urlCount').innerText = parseInt(document.getElementById('urlCount').innerText) + 1;
        });

        socket.on('scan_completed', () => {
            addLog(">>> [SUCCESS] 정찰 사이클이 완료되었습니다.");
            document.getElementById('startBtn').disabled = false;
        });

        function addLog(msg) {
            const div = document.createElement('div');
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logWindow.appendChild(div);
            logWindow.scrollTop = logWindow.scrollHeight;
        }
    </script>
</body>
</html>
